name: Sync secrets

# SOPS (git source of truth) -> AWS Secrets Manager. When a committed, SOPS-
# encrypted secrets.<env>.yaml changes, this workflow decrypts it and writes one
# JSON secret per environment to AWS Secrets Manager (k8s-fastapi-starter/<env>/app-secrets,
# keys DATABASE_URL + REDIS_URL). The External Secrets Operator then materializes
# the app-secrets Kubernetes Secret from that entry. Argo CD never touches ciphertext.
#
# paths:/paths-ignore: are workflow-level keys under on.<event> (NOT job-level):
# a dedicated workflow keeps this gated on secrets files without gating all of CI.
#
# The template default ships only secrets.example.yaml, so on an uninitialized
# template this workflow is a no-op (the skip-if-absent guard succeeds per env).
#
# IAM: the OIDC role assumed below (vars.AWS_DEPLOY_ROLE_ARN) needs, IN ADDITION
# to the kms:Decrypt it already uses for SOPS:
#   - secretsmanager:PutSecretValue
#   - secretsmanager:CreateSecret
#   - secretsmanager:DescribeSecret
#   - secretsmanager:RestoreSecret
# all scoped to arn:aws:secretsmanager:*:*:secret:k8s-fastapi-starter/*/app-secrets-*
#
# Supply-chain note: actions are pinned to full commit SHAs (reused from ci.yml /
# the former deploy.yml), with the version in a trailing comment. Dependabot
# (github-actions ecosystem) updates both.

on:
  push:
    branches: [main]
    paths: ['deploy/k8s/overlays/**/secrets.*.yaml']
  pull_request:
    paths: ['deploy/k8s/overlays/**/secrets.*.yaml']

# Least privilege by default. The job adds id-token: write for OIDC.
permissions:
  contents: read

concurrency:
  group: sync-secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-secrets:
    name: Sync ${{ matrix.env }} secrets to Secrets Manager
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for aws-actions/configure-aws-credentials OIDC
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      DEPLOY_ENV: ${{ matrix.env }}
      SECRET_FILE: deploy/k8s/overlays/${{ matrix.env }}/secrets.${{ matrix.env }}.yaml
      SECRET_ID: k8s-fastapi-starter/${{ matrix.env }}/app-secrets
      SOPS_VERSION: 3.13.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Template default ships only secrets.example.yaml. If no SOPS-encrypted
      # secrets.<env>.yaml exists for this env, there is nothing to sync.
      - name: Skip if no secrets file for this environment
        id: guard
        run: |
          set -euo pipefail
          if [ ! -f "${SECRET_FILE}" ]; then
            echo "skipping ${DEPLOY_ENV}: no secrets file (${SECRET_FILE} absent)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sops
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x "$RUNNER_TEMP/bin/sops"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # yq is the mikefarah build, preinstalled on ubuntu-latest. The extraction
      # expression below uses the @base64d operator, which is mikefarah-specific
      # (the Python yq does not provide it), so the flavor is load-bearing — do
      # not substitute Python yq.

      # OIDC: no stored AWS keys. The role ARN is an environment variable, not a
      # secret. Gated to push-on-main so fork PRs never mutate AWS; on PRs only
      # the dry-run decrypt + key-shape validation (below) runs.
      - name: Assume AWS role (OIDC)
        if: steps.guard.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }} # PLACEHOLDER: set per GitHub Environment
          aws-region: ${{ vars.AWS_REGION }}              # PLACEHOLDER: set per GitHub Environment

      - name: Decrypt, validate key shape, and sync to Secrets Manager
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail

          tmp="${RUNNER_TEMP}/secret.json"
          # Never leave decrypted plaintext behind, even on failure.
          trap 'rm -f "${tmp}"' EXIT

          # Decrypt and extract ONLY the value map. Prefer stringData (plaintext);
          # fall back to base64-decoded data. apiVersion/kind/metadata/type are
          # never included, so no non-secret cruft reaches Secrets Manager.
          sops -d "${SECRET_FILE}" \
            | yq -o=json '.stringData // (.data | map_values(@base64d))' > "${tmp}"

          # Mask the extracted values so they can never surface in logs.
          yq -r '.[]' "${tmp}" | while IFS= read -r val; do
            echo "::add-mask::${val}"
          done

          # The write->read contract is validated here and NOWHERE else (kustomize/
          # kubeconform never see values; envFrom does not require specific keys).
          # The extracted key set must equal EXACTLY {DATABASE_URL, REDIS_URL}.
          keys="$(yq -o=json -I=0 'keys | sort' "${tmp}")"
          expected='["DATABASE_URL","REDIS_URL"]'
          if [ "${keys}" != "${expected}" ]; then
            # Name offending keys, NEVER their values.
            extra="$(yq -r 'keys[] | select(. != "DATABASE_URL" and . != "REDIS_URL")' "${tmp}" || true)"
            for k in DATABASE_URL REDIS_URL; do
              if ! yq -e --exit-status ".${k}" "${tmp}" >/dev/null 2>&1; then
                echo "::error::${SECRET_FILE}: missing required key '${k}'"
              fi
            done
            if [ -n "${extra}" ]; then
              echo "::error::${SECRET_FILE}: unexpected key(s): ${extra} (only DATABASE_URL and REDIS_URL are allowed)"
            fi
            echo "::error::${SECRET_FILE}: key set must be exactly {DATABASE_URL, REDIS_URL}"
            exit 1
          fi
          echo "${DEPLOY_ENV}: key shape OK (DATABASE_URL, REDIS_URL)"

          # On PRs (and forks) the AWS credentials are not configured — stop after
          # the dry-run decrypt + validation so breakage is caught before merge
          # without ever mutating AWS.
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "${DEPLOY_ENV}: dry-run only (not a push to main); skipping Secrets Manager write"
            exit 0
          fi

          # Write: put-secret-value FIRST; only on ResourceNotFoundException fall
          # back to create-secret (first-run bootstrap). No pre-probe with
          # describe-secret — catching the error from put avoids a TOCTOU window and
          # is safe with the dev/prod matrix running in parallel (distinct ids).
          err="${RUNNER_TEMP}/aws.err"
          if aws secretsmanager put-secret-value \
              --secret-id "${SECRET_ID}" \
              --secret-string "file://${tmp}" 2>"${err}"; then
            echo "${DEPLOY_ENV}: updated ${SECRET_ID}"
          else
            code="$(cat "${err}")"
            if printf '%s' "${code}" | grep -q 'ResourceNotFoundException'; then
              echo "${DEPLOY_ENV}: ${SECRET_ID} not found; creating (first run)"
              aws secretsmanager create-secret \
                --name "${SECRET_ID}" \
                --secret-string "file://${tmp}"
              echo "${DEPLOY_ENV}: created ${SECRET_ID}"
            elif printf '%s' "${code}" | grep -q 'InvalidRequestException'; then
              # Secret is scheduled for deletion. create-secret would also fail;
              # do not swallow it — the operator must restore it first.
              echo "::error::${SECRET_ID} is scheduled for deletion. Run 'aws secretsmanager restore-secret --secret-id ${SECRET_ID}' first, then re-run this workflow."
              exit 1
            else
              # IAM denied / throttled / other — surface the AWS error (no values).
              echo "::error::Failed to write ${SECRET_ID}: ${code}"
              exit 1
            fi
          fi
