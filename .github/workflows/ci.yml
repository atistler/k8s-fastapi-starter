name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs that need more declare it locally.
permissions:
  contents: read

# Supply-chain note: actions are pinned to full commit SHAs, with the version in a
# trailing comment. Dependabot (github-actions ecosystem) updates both.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # uv reads .python-version, so the Python version is controlled from one file.
      - run: uv run poe install
      # pre-commit runs ruff + the mypy --strict hook, so typecheck is covered here
      # (no separate `poe typecheck` step — that would run mypy twice).
      - name: pre-commit (all files)
        run: uvx pre-commit run --all-files --show-diff-on-failure

  commits:
    name: Conventional Commits
    # The commit-msg hook only runs on local commits; this enforces the format in
    # CI (the changelog/git-cliff depend on it). PRs only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate Conventional Commits in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "${sha}" > "${RUNNER_TEMP}/msg"
            if ! uvx conventional-pre-commit==4.4.0 "${RUNNER_TEMP}/msg"; then
              echo "::error::Commit ${sha} is not a Conventional Commit"
              fail=1
            fi
          done
          exit "${fail}"

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Throwaway CI credentials for the service containers below. Not used outside this job.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv run poe install
      - run: uv run poe db-upgrade
      - run: uv run poe test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv run poe audit

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: 0.8.0
      KUBE_LINTER_VERSION: 0.8.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install kubeconform and kube-linter
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP/bin" kubeconform
          curl -sSfL -o "$RUNNER_TEMP/bin/kube-linter" \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux"
          chmod +x "$RUNNER_TEMP/bin/kube-linter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render and validate overlays
        run: uv run poe k8s-check

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv run poe docs-build

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only this job may push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: local/app:${{ github.sha }}
      - name: Trivy scan (fails on CRITICAL/HIGH with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR (main only, tagged with commit SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}" # GHCR requires lowercase repository names
          docker tag "local/app:${GITHUB_SHA}" "ghcr.io/${repo}:${GITHUB_SHA}"
          docker push "ghcr.io/${repo}:${GITHUB_SHA}"
