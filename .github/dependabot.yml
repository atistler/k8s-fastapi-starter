version: 2

# Weekly updates for pinned actions, Python dependencies, the base image, and pre-commit hook revs.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv ecosystem so Dependabot updates uv.lock directly. The "pip" ecosystem
  # would edit pyproject.toml without touching uv.lock, breaking CI's
  # `uv sync --frozen` / `uv export --frozen` and missing PEP 735 dev groups.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
