site_name: K8s FastAPI starter
site_description: Template for a Kubernetes-deployed FastAPI service backed by PostgreSQL and Redis
docs_dir: docs
site_dir: site

# Built from the repo root by TechDocs in Backstage (catalog-info.yml) and by `uv run poe docs-build` in CI.
# Keep YAML plain (no !!python tags) so pre-commit check-yaml passes.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  # SuperFences defaults to fence_code_format; omit the Python YAML tag so
  # check-yaml can safely parse this file.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Getting started:
      - Local setup: getting-started.md
      - Architecture: architecture.md
  - Development:
      - Contributing: contributing.md
      - Configuration: configuration.md
      - Database migrations: database-migrations.md
      - Continuous integration: ci.md
  - Operations:
      - Deployment: deployment.md
      - Secrets: secrets.md
      - Monitoring: monitoring.md
      - Security: security.md
      - Releasing: releasing.md
  - Decisions:
      - ADR 0001 - Technology choices: adr/0001-technology-choices.md
      - ADR 0002 - Task runner (poe): adr/0002-task-runner-poe.md
