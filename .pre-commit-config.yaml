# Local quality gates. CI runs `pre-commit run --all-files` (see .github/workflows/ci.yml).
# Install with `uv run poe hooks`. Revs are pinned to release tags; update via Dependabot (pre-commit ecosystem).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # Docker-based so no local hadolint install is required. Needs a running Docker daemon.
      - id: hadolint-docker

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: check-sops-encrypted
        name: SOPS secrets must be encrypted
        description: Fails if deploy/**/secrets.*.yaml has no top-level sops block (SPEC 9).
        entry: uv run python scripts/check_sops_encrypted.py
        language: system
        files: ^deploy/.*/secrets\.[^/]+\.yaml$
        pass_filenames: false

      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
