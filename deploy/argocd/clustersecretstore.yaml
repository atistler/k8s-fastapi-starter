# External Secrets Operator: ClusterSecretStore
#
# One cluster-scoped store that both overlays' ExternalSecrets reference by
# name. It lives here (deploy/argocd/, which has no `namespace:` transformer)
# rather than in deploy/k8s/base/, so it renders cluster-scoped and
# un-namespaced — a base-placed store would be stamped with a namespace by each
# overlay's namespace transformer, producing two divergent, invalid objects.
#
# No `auth` block: the store holds NO credentials. ESO's controller
# ServiceAccount carries the read-only AWS IRSA role (assumed configured at the
# cluster level, like the Datadog Agent), so it is safe to commit. It only names
# the provider and region.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: PLACEHOLDER_AWS_REGION
