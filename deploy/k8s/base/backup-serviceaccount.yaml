# ServiceAccount for the daily database backup CronJob.
#
# Unlike the `app` SA (automountServiceAccountToken: false — the API never calls
# AWS), this SA MUST mount its projected service-account token: IRSA relies on
# the projected web-identity token so the AWS CLI can call STS
# AssumeRoleWithWebIdentity and assume the backup role (S3 PutObject + KMS
# Encrypt). With the token unmounted every backup would fail to authenticate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  labels:
    app.kubernetes.io/name: k8s-fastapi-starter
    app.kubernetes.io/component: backup
  annotations:
    eks.amazonaws.com/role-arn: PLACEHOLDER_BACKUP_ROLE_ARN
automountServiceAccountToken: true
