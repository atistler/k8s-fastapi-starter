# Keeps a floor of available API pods during voluntary disruptions (node drains,
# upgrades). prod runs 3 replicas, so minAvailable 2 lets one node drain at a
# time without taking the service below 2. prod-only: a PDB with a single dev
# replica would block drains entirely.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
  labels:
    app.kubernetes.io/name: k8s-fastapi-starter
    app.kubernetes.io/component: api
spec:
  minAvailable: 2
  # Let unhealthy (not-ready) pods be evicted even at the floor, so a node drain
  # is never blocked by a pod that is already broken.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-fastapi-starter
      app.kubernetes.io/component: api
