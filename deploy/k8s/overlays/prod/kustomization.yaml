# Overlay: prod
#
# The `app-secrets` Secret is materialized by the External Secrets Operator from
# externalsecret.yaml below (which points at AWS Secrets Manager) — kustomize no
# longer touches any secret material. Rotation is: edit the SOPS file, commit;
# CI (sync-secrets) decrypts it to AWS Secrets Manager; ESO syncs it into the
# cluster as the `app-secrets` Secret that deployment.yaml/migration-job.yaml
# consume by name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fastapi-starter-prod

resources:
  - ../../base
  - pdb.yaml
  - externalsecret.yaml

images:
  - name: ghcr.io/PLACEHOLDER_GITHUB_ORG/k8s-fastapi-starter
    # Placeholder. CD sets the release tag (or commit SHA) with `kustomize edit set image`.
    newTag: "0.0.0"

replicas:
  - name: app
    count: 3

patches:
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: app-config
      data:
        APP_ENV: "prod"
        LOG_LEVEL: "INFO"
  # Stricter resources than base: larger requests so the scheduler reserves
  # real capacity, and tighter limits to bound noisy-neighbour impact.
  - target:
      kind: Deployment
      name: app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          metadata:
            labels:
              # Datadog unified service tagging: env=prod on the pod template
              # label. DD_ENV reads this via fieldRef (see base/deployment.yaml).
              tags.datadoghq.com/env: "prod"
          spec:
            # Spread replicas across nodes. Preferred (not required) so that a
            # small cluster can still schedule all replicas.
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: k8s-fastapi-starter
                          app.kubernetes.io/component: api
            containers:
              - name: api
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 512Mi
  - target:
      kind: Job
      name: app-migrate
    patch: |-
      - op: replace
        path: /metadata/name
        value: app-migrate-prod
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
  # Mandatory: set the backup S3 prefix to this environment so dev and prod
  # dumps never collide under the same bucket (s3://…/prod/…).
  - target:
      kind: CronJob
      name: db-backup
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/0/value
        value: prod
