# External Secrets Operator: ExternalSecret (prod)
#
# A pointer with ZERO secret material. It tells ESO to materialize the
# `app-secrets` Kubernetes Secret from the AWS Secrets Manager entry
# k8s-fastapi-starter/prod/app-secrets, via the cluster-scoped
# `aws-secrets-manager` store (see deploy/argocd/clustersecretstore.yaml).
#
# Named `app-secrets-external` — deliberately distinct from the Secret it
# produces (target.name: app-secrets), so the CR and the Secret never collide
# in `kubectl get`. deployment.yaml and migration-job.yaml keep consuming
# `secretRef: app-secrets` unchanged.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s-fastapi-starter/prod/app-secrets
